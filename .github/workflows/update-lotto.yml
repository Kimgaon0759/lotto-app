name: 로또 당첨번호 자동 업데이트

on:
  schedule:
    - cron: '10 12 * * 6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 당첨번호 업데이트
        run: python3 update_lotto.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/lotto.json index.html
          if git diff --staged --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "자동 업데이트: $(date '+%Y-%m-%d') 로또 당첨번호"
            git push
          fi
